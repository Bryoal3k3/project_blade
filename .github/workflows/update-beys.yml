name: Weekly Beyblade update

# Every Monday: import the latest Hasbro Beyblade X lineup from the wiki, check it, and publish it.
# The check date in src/data/checked.json changes every run, so there is always a commit; that also
# keeps GitHub from switching this schedule off after 60 quiet days.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-beys
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import the latest Beys from the wiki
        run: npm run import
      - run: npm test
      - run: npm run build
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/data src/photos)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data src/photos
          git commit -m "Weekly Beyblade update $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
          # Pushes made with this token don't start other workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref main
